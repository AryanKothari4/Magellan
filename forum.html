<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 50%, #fff5f0 100%);
            color: #333;
            min-height: 100vh;
        }

        /* Grid background - same as homepage */
        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, rgba(30, 64, 175, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(30, 64, 175, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* Header - same as homepage */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            z-index: 1000;
        }

        .logo {
            font-family: 'Playfair Display', 'Georgia', serif;
            font-size: 2rem;
            font-weight: 700;
            color: #1e40af;
            letter-spacing: 2px;
            position: relative;
            cursor: pointer;
            text-decoration: none;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #1e40af, #ea580c);
            transition: width 0.3s;
        }

        .logo:hover::after {
            width: 100%;
        }

        nav a {
            margin-left: 2rem;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #1e40af;
        }

        .cta-button {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            display: inline-block;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.3);
        }

        /* Main content */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 120px 5% 4rem;
            position: relative;
            z-index: 1;
        }

        .page-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .page-title {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e40af, #3b82f6, #ea580c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            opacity: 0;
        }

        .page-subtitle {
            font-size: 1.3rem;
            color: #4b5563;
            opacity: 0;
        }

        /* Discussion cards grid */
        .discussions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .discussion-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
            opacity: 0;
        }

        .discussion-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(30, 64, 175, 0.05), transparent);
            transition: left 0.5s;
        }

        .discussion-card:hover::before {
            left: 100%;
        }

        .discussion-card:hover {
            transform: translateY(-10px) rotate(1deg);
            box-shadow: 0 20px 50px rgba(30, 64, 175, 0.15);
            border-color: #1e40af;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            gap: 1rem;
        }

        .card-meta {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .university-tag {
            display: inline-block;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: fit-content;
        }

        .time-ago {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .hearts-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #fef3f2;
            padding: 0.5rem 1rem;
            border-radius: 15px;
            white-space: nowrap;
        }

        .heart-icon {
            color: #ea580c;
            font-size: 1.2rem;
        }

        .hearts-count {
            color: #ea580c;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .discussion-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1e40af;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .discussion-preview {
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 2px solid #f3f4f6;
        }

        .topic-badge {
            background: #f0f9ff;
            color: #1e40af;
            padding: 0.4rem 1rem;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .replies-count {
            color: #6b7280;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .replies-icon {
            font-size: 1.1rem;
        }

        /* Modal overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 2rem;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 30px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 3rem;
            position: relative;
            box-shadow: 0 25px 100px rgba(0, 0, 0, 0.3);
            transform: scale(0.9);
            opacity: 0;
        }

        .modal-content.active {
            animation: modalIn 0.4s ease forwards;
        }

        @keyframes modalIn {
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .close-modal {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: #f3f4f6;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            color: #6b7280;
        }

        .close-modal:hover {
            background: #1e40af;
            color: white;
            transform: rotate(90deg);
        }

        .modal-header {
            margin-bottom: 2rem;
            padding-right: 3rem;
        }

        .modal-university {
            display: inline-block;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .modal-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #1e40af;
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }

        .modal-meta {
            display: flex;
            gap: 2rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .modal-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #6b7280;
            font-size: 0.95rem;
        }

        .modal-hearts {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #fef3f2;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
        }

        .modal-hearts .heart-icon {
            font-size: 1.3rem;
        }

        .modal-hearts .hearts-count {
            font-size: 1.2rem;
        }

        .modal-body {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #374151;
            margin-bottom: 2.5rem;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            padding-top: 2rem;
            border-top: 2px solid #f3f4f6;
        }

        .reply-button {
            flex: 1;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .reply-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.3);
        }

        .heart-button {
            background: #fef3f2;
            color: #ea580c;
            border: 2px solid #ea580c;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .heart-button:hover {
            background: #ea580c;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(234, 88, 12, 0.3);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .page-title {
                font-size: 2.5rem;
            }

            .discussions-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 2rem;
                margin: 1rem;
            }

            .modal-title {
                font-size: 1.7rem;
            }

            .modal-actions {
                flex-direction: column;
            }
        }

        /* Empty state (if needed later) */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #9ca3af;
        }

        /* Loading animation */
        .loading {
            text-align: center;
            padding: 4rem;
            font-size: 1.2rem;
            color: #1e40af;
        }
    </style>
</head>

        // Load discussions into grid
        function loadDiscussions() {
            const grid = document.getElementById('discussionsGrid');
            
            discussions.forEach((discussion, index) => {
                const card = document.createElement('div');
                card.className = 'discussion-card';
                card.style.opacity = '0';
                card.onclick = () => openModal(discussion);
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-meta">
                            <span class="university-tag">${discussion.university}</span>
                            <span class="time-ago">${discussion.timeAgo}</span>
                        </div>
                        <div class="hearts-container">
                            <span class="heart-icon">❤️</span>
                            <span class="hearts-count">${discussion.hearts}</span>
                        </div>
                    </div>
                    <h3 class="discussion-title">${discussion.title}</h3>
                    <p class="discussion-preview">${discussion.body}</p>
                    <div class="card-footer">
                        <span class="topic-badge">${discussion.topic}</span>
                        <span class="replies-count">
                            <span class="replies-icon">💬</span>
                            ${discussion.replies} ${discussion.replies === 1 ? 'reply' : 'replies'}
                        </span>
                    </div>
                `;
                
                grid.appendChild(card);
            });

            // Animate cards in with stagger
            anime({
                targets: '.discussion-card',
                opacity: [0, 1],
                translateY: [50, 0],
                rotate: [3, 0],
                duration: 800,
                delay: anime.stagger(100),
                easing: 'easeOutExpo'
            });
        }

        // Open modal with discussion details

                        </div>
                        <div class="modal-meta-item">

                        </div>
                        <div class="modal-meta-item">
                            <span class="topic-badge">${discussion.topic}</span>
                        </div>
                        <div class="modal-hearts">
                            <span class="heart-icon">❤️</span>
                            <span class="hearts-count">${discussion.hearts}</span>
                        </div>
                    </div>
                </div>
                <div class="modal-body">
                    <p>${discussion.body}</p>
                </div>
                <div class="modal-actions">
                    <button class="reply-button">💬 Reply to Discussion</button>
                    <button class="heart-button">
                        <span>❤️</span>
                        <span>Give Heart</span>
                    </button>
                </div>
            `;
            
            overlay.classList.add('active');
            setTimeout(() => {
                content.classList.add('active');
            }, 10);
        }

        // Close modal
        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            
            content.classList.remove('active');
            setTimeout(() => {
                overlay.classList.remove('active');
            }, 300);
        }

        // Event listeners
        document.getElementById('closeModal').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') {
                closeModal();
            }
        });

        // ESC key to close modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Animate page title on load
        anime({
            targets: '.page-title',
            opacity: [0, 1],
            translateY: [30, 0],
            duration: 800,
            easing: 'easeOutExpo'
        });

        anime({
            targets: '.page-subtitle',
            opacity: [0, 1],
            translateY: [20, 0],
            duration: 800,
            delay: 200,
            easing: 'easeOutExpo'
        });

        // Load discussions when page loads
        window.addEventListener('DOMContentLoaded', () => {
            loadDiscussions();
        });
    </script>
</body>
</html>
